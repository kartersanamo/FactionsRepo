prefix: "&8[&cReboot&8] &7"
no-permission: "%prefix%You do not have permission to reboot servers."
players-only: "%prefix%Only a player on a backend server can use this command."
usage: "%prefix%Usage: &e/reboot <30s|5m|1h|cancel>"
console-usage: "%prefix%Usage: &e/reboot <30s|5m|1h|cancel> <dev-1|dev-2>"
unknown-server: "%prefix%You are not connected to a backend server."
server-not-allowed: "%prefix%Reboot is only available on &edev-1 &7and &edev-2&7."
invalid-duration: "%prefix%Invalid duration. Use &e30s&7, &e5m&7, or &e1h&7. Minimum %min%, maximum %max%."
already-scheduled: "%prefix%A reboot is already scheduled for &e%server%&7. Use &e/reboot cancel&7 first."
restart-in-progress: "%prefix%&e%server% &7is already restarting."
nothing-to-cancel: "%prefix%There is no pending reboot for &e%server%&7."
too-late-to-cancel: "%prefix%The reboot for &e%server% &7has already started and cannot be cancelled."
cancelled: "%prefix%The reboot for &e%server% &7has been cancelled."
scheduled: "%prefix%&e%server% &7will reboot in &c%time%&7. Finish what you are doing and wait to be moved to hub."
one-minute: "%prefix%&e%server% &7will reboot in &c1 minute&7."
countdown: "%prefix%&e%server% &7rebooting in &c%seconds%s&7."
restarting: "%prefix%&e%server% &7is restarting now. You have been moved to hub and will be returned when it is ready."
queued-waiting: "%prefix%&e%server% &7is still restarting. Wait on hub; you will be sent back automatically."
returned: "%prefix%&e%server% &7is back. Sending you now."
failed: "%prefix%&e%server% &7did not come back in time. Stay on hub and tell an admin."
server-unavailable: "%prefix%&e%server% &7is restarting. You cannot join it yet."
hub-missing: "%prefix%Hub server &e%hub% &7is not configured on the proxy."
